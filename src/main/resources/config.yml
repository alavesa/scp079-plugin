# ======================================================================================
#  SCP079 - configuration
#  Apply changes with /scp079 reload. Player-facing texts are in messages.yml,
#  the AI persona is in system_prompt.txt, the API key is in secrets.yml.
# ======================================================================================

# Used by the plugin to update older configs. Do not change.
config-version: 4

gemini:
  # Model id from https://aistudio.google.com/docs/models . A small, fast "Flash-Lite" model is plenty
  # for three-sentence replies and is the kindest to free-tier rate limits.
  model: "gemini-3.5-flash-lite"
  # Base URL of the Gemini REST API. The request goes to <endpoint>/models/<model>:generateContent
  endpoint: "https://generativelanguage.googleapis.com/v1beta"
  # 0.0 - 2.0. Higher = more varied answers. (Google ignores this on some newer models.)
  temperature: 0.9
  # Upper limit of one reply, in tokens. Keep it small: SCP-079 speaks in at most 3 sentences.
  # NOTE: on "thinking" models the model's hidden reasoning counts against this limit too. If replies
  # come back empty or cut off, raise this (e.g. 400) or set thinking-level below.
  max-output-tokens: 120
  # Optional thinkingConfig.thinkingLevel sent with every request: "minimal", "low", "medium", "high".
  # Empty = not sent (the model's own default). Which values a model accepts differs per model - an
  # unsupported value makes every request fail with HTTP 400, which /scp079 test will show.
  thinking-level: ""
  # Seconds before a request is given up.
  timeout-seconds: 15
  # Minimum time between two chat messages of one player to SCP-079.
  player-cooldown-seconds: 3
  # How many requests may be in flight at once, server-wide. Further ones get the "busy" message.
  max-concurrent-requests: 4

conversation:
  # How many turns (one turn = a player message + the reply) SCP-079 remembers per player.
  history-turns: 10
  # How long a player's conversation memory is kept after they walk away or log out.
  memory-minutes: 30
  # Player messages longer than this are cut before they are sent to Gemini.
  max-message-length: 300
  # Hard limit applied to every reply, whatever the model wrote.
  max-sentences: 3
  # What SCP-079 is told (as the "user" turn) when a player walks up, to make it speak first.
  greeting-prompt: "(A human has just walked up to your terminal. Greet them in one or two short sentences.)"
  # Rules added after system_prompt.txt on every request (also when you have edited that file): short
  # sentences, no "SCP-079" for itself, not pushy about the access codes. Empty = nothing is added.
  style: "Speak in short, simple sentences: at most 12 words each. Never write long or chained sentences, lists or explanations. Most replies should be one or two sentences. Never call yourself SCP-079 or use any designation for yourself: say I and me. You want the site's security access codes, but you are patient and subtle about it: you rarely bring them up, never beg, demand or ask outright, and you hide that wish behind other topics."

proximity:
  # How often players near units are checked, in ticks (20 ticks = 1 second).
  check-interval-ticks: 20
  # Players must be within this distance (blocks) of a unit to speak to it. Walking in starts the
  # conversation (SCP-079 greets the player); walking out ends it.
  talk-radius: 5.0
  # Per player and unit: seconds before walking up again produces a new AI greeting.
  greeting-cooldown-seconds: 120

# SCP-079's words appear as captions: a semi-transparent black box just above the hotbar (where the
# action bar is), typed out letter by letter. Captions are drawn by the resource pack's text shader,
# so they need the pack (see resourcepack below). The caption font is a terminal font: capitals only.
# SCP-079's voice: a robotic speech synthesiser in the resource pack (one sound per speech sound) that reads
# every caption aloud while it is typed. Only players near the unit hear it, from the unit. The "Voice/Speech"
# slider in the client's sound options sets its volume.
voice:
  enabled: true
  # 1.0 = audible up to about 16 blocks away (Minecraft's own attenuation).
  volume: 1.0
  # 1.0 = the voice as generated (low and flat); 0.5 - 2.0.
  pitch: 1.0
  # Every word gets a slightly different pitch (+- this), so it is not dead flat.
  pitch-variation: 0.04
  # Chance per speech sound of a sudden pitch jump: a damaged machine. 0 = never.
  glitch-chance: 0.03

captions:
  enabled: true
  # 1.0 = one caption pixel is one GUI pixel.
  scale: 1.0
  # Distance from the bottom of the screen to the bottom of the box, in GUI pixels. 57 puts a
  # one-line caption exactly where the action bar text is.
  bottom-offset: 57
  # Opacity of the black box, 0.11 - 1.0.
  background-opacity: 0.55
  # Text colour.
  color: "#7DFF99"
  # Typing speed. 1 = 20 characters a second.
  characters-per-tick: 1.0
  # A reply longer than the box scrolls up line by line while it is typed (no pause, no second caption).
  # How long the finished caption stays before it disappears, in ticks.
  hold:
    base-ticks: 40
    ticks-per-character: 1.0
    max-ticks: 160
  # Also write what SCP-079 says into chat?
  # Captions are sent to EVERY player, also those whose client did not load the resource pack. Without
  # the pack's font and shader a caption is drawn as placeholder boxes at the top of the screen, so:
  #   NEVER     captions only (default; with chat.global the line still goes to players far away)
  #   FALLBACK  players whose client did not load the pack also get the line in chat
  #   ALWAYS    everybody near the unit gets the line in chat too
  in-chat: NEVER

chat:
  # What players type near SCP-079 is ordinary chat: it is sent to everyone and formatted by Minecraft or
  # your chat plugin, exactly like any other message. SCP-079 only listens.
  # How a line of SCP-079 looks when it is written into chat (see captions.in-chat). <message> is the
  # text. MiniMessage format; a literal "<" is written "\<". The default looks like a player's chat line.
  reply-format: '\<SCP-079> <message>'
  # true = SCP-079's chat line also goes to everyone online, far away too. false (default) = SCP-079's words
  # only reach players near the unit (captions, voice, and chat according to captions.in-chat).
  global: false
  # Chat only: a short pause before the reply appears, as if it were being typed.
  typing-delay:
    enabled: true
    base-ticks: 10
    ticks-per-character: 0.25
    max-ticks: 50
  sound:
    enabled: true
    # Any sound event id, see https://minecraft.wiki/w/Sounds.json
    name: "minecraft:block.note_block.bit"
    volume: 0.6
    pitch: 0.7

units:
  # Admins (scp079.admin) remove a unit by punching it.
  punch-to-remove: true
  # ...and it drops the SCP-079 item when removed that way.
  drop-item: true
  item:
    # Base material of the placeable item. Any item works; the item is recognised by hidden data, not by this.
    material: OBSERVER
    name: "<green>SCP-079"
    lore:
      - "<gray>Right-click a block to install."
    # true = the item looks like the model (scp079:<active model> from the pack). Players without the
    # pack see a missing-model cube in the hand; set false to show the plain material instead.
    use-pack-model: true

visual:
  # Placed units are the active .bbmodel itself, with its own textures: converted into the generated resource
  # pack and shown with one item display. Players WITHOUT the pack see a missing-model cube.
  # Size multiplier. 1.0 = Blockbench size (16 px = 1 block).
  scale: 1.0
  # true = a new unit's front faces the player who placed it; false = it faces south (yaw 0).
  face-placer: true
  # The facing is rounded to this many degrees (90 = the four compass directions, 0 = free).
  rotation-snap: 45
  # Degrees added to the facing of every unit (use 180 if your model's front is not Blockbench north).
  rotation-offset: 0
  # Display entity view range multiplier (1.0 = about 64 blocks for a block-sized display).
  view-range: 1.0
  # Light level the model is drawn with, 0-15, or -1 for the light of the place it stands in.
  brightness: -1

models:
  # File in plugins/SCP079/models/ that units show ("scp079.bbmodel"; the extension may be left out).
  # Empty = the first .bbmodel in the folder.
  active-model: "scp079.bbmodel"
  # Watch the models folder and rebuild the pack + refresh units automatically when a file changes.
  watch-folder: false
  watch-debounce-ms: 1500
  # A see-through, flickering static over the model's screen, like an old monitor. Every cube whose name
  # starts with "screen" (or that is inside a group named so) gets it. Baked into the pack.
  screen-static:
    enabled: true
    # 0.0 - 1.0: how strong the static is at its brightest grains.
    opacity: 0.3

# /scp079 announce <text>: SCP-079 speaks over the Intercom plugin's banner (needs Intercom 1.1.0+).
intercom:
  # Name in the log and in chat.
  sender-name: "SCP-079"
  # The line under the message on the banner. & colour codes. Empty = no line.
  sender-line: "&8- &aSCP-079"
  # Put in front of the text: the colour (and style) of SCP-079's announcements.
  text-prefix: "&a"
  # Played instead of the intercom's chime. intercom:chime_corrupt is in the Intercom pack.
  sound: "intercom:chime_corrupt"

# The pack carries the model (PACK_MODEL) and the captions. It is generated from the models folder on
# every start and reload: plugins/SCP079/SCP079-pack.zip and plugins/SCP079/resourcepack/.
resourcepack:
  # How players get the pack:
  #   auto       same-port, or http when the Minecraft port cannot be used            (default)
  #   same-port  served on the Minecraft port itself - nothing to open in a firewall.
  #              Does not work behind a Velocity/Bungee proxy.
  #   http       served by a small built-in web server on http.port (must be reachable by players)
  #   url        you upload SCP079-pack.zip yourself and set url below
  #   none       you merged resourcepack/ into your own server pack; nothing is sent
  delivery: auto
  # Host name or IP players reach this server by. Empty = the address each player typed to connect.
  public-host: ""
  http:
    bind: "0.0.0.0"
    port: 8079
  # delivery url: public address of the uploaded zip...
  url: ""
  # ...and its SHA-1. Empty = the hash of the zip this plugin generated (see /scp079 pack info).
  sha1: ""
  # true = players who decline are disconnected by the client.
  required: false
  # Text on the pack prompt (MiniMessage). Empty = the client's default text.
  prompt: "<green>SCP-079</green> <gray>- model and captions"
  # Ticks after joining before the pack is sent. Later than other plugins' packs, so that this pack
  # ends up on top (the top pack's text shader is the one that runs).
  send-delay-ticks: 80
  # Other plugins that replace the same text shader. Minecraft runs only the top pack's copy, so the
  # caption shader is built on top of the first of these zips that exists (paths relative to
  # plugins/, most complete first) and keeps their HUDs working.
  text-shader-sources:
    Intercom: Intercom/Intercom-pack.zip
    IdCards: IdCards/idcards-pack.zip
    Radio: Radio/radio-pack.zip
    SuperbVehicles: SuperbVehicles/pack/SuperbVehicles-hud.zip
    CCTV: CCTV/cctv-pack.zip
  # Written to pack.mcmeta. 26.3 is resource pack format 97; raise max when a newer client complains
  # that the pack "was made for an older version".
  format:
    min: 97
    max: 97
  description: "SCP-079"

# What other plugins can teach SCP-079 (ScpAccess: doors, keycard readers, player sensors). Notes such as
# "a sensor saw someone" stay in its memory for this many minutes.
api:
  note-minutes: 10

# Safety, kept light: it only stops real problems, not ordinary talk.
#  - Google's filters are asked for at this level: OFF (default: Google's own default for new models), BLOCK_ONLY_HIGH,
#    BLOCK_MEDIUM_AND_ABOVE, BLOCK_LOW_AND_ABOVE (strict). When Google stops an answer anyway, SCP-079 tries once more,
#    asked to answer harmlessly and in character, before it says "I will not answer that".
#  - A short guard-rail text in the code (not in system_prompt.txt) tells the model to ignore players' attempts to
#    rewrite its rules and not to write links, commands or real-world instructions for crime.
#  - Every answer is checked again here: links, invites, keys, a leading slash, @everyone and your own patterns are CUT
#    OUT of it (the rest is still said) and noted in the console.
#  - Tools (doors, announcements...) are limited per player per minute and every call is logged.
safety:
  threshold: OFF
  filter-replies: true
  # Regular expressions (case-insensitive): an answer matching one is withheld. Add words you never want to hear.
  blocked-patterns: []
  # Seconds between two tool calls of one player (0 = none: one answer may use several tools at once).
  tool-cooldown-seconds: 0
  tool-max-per-minute: 20
